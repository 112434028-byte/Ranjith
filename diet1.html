<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitZone - Diet Plan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">FITZONE</div>

    <div class="nav-links">
        <a href="home.php">Home</a>
        <a href="membership.html">Membership</a>
        <a href="diet.html">Diet</a>
        <a href="login.html">Logout</a>
    </div>

</nav>

<section class="diet-section">

    <h1>Get Your Diet Plan</h1>

    <form action="diet.php" method="POST" id="dietForm">

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" id="name">
            <small id="nameError"></small>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" id="age" min="13" max="80">
            <small id="ageError"></small>
        </div>

        <div class="form-group">
            <label>Gender</label>

            <select name="gender" id="gender">

                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>

            </select>

            <small id="genderError"></small>
        </div>

        <div class="form-group">
            <label>Weight (kg)</label>
            <input type="number" name="weight" id="weight"
                   min="30" max="300" step="0.1">

            <small id="weightError"></small>
        </div>

        <div class="form-group">
            <label>Height (cm)</label>

            <input type="number" name="height" id="height"
                   min="100" max="250" step="0.1">

            <small id="heightError"></small>
        </div>

        <div class="form-group">

            <label>Fitness Goal</label>

            <select name="goal" id="goal">

                <option value="">Select Goal</option>

                <option value="Weight Loss">
                    Weight Loss
                </option>

                <option value="Muscle Gain">
                    Muscle Gain
                </option>

                <option value="Maintain Weight">
                    Maintain Weight
                </option>

                <option value="General Fitness">
                    General Fitness
                </option>

            </select>

            <small id="goalError"></small>

        </div>

        <div class="form-group">

            <label>Activity Level</label>

            <select name="activity" id="activity">

                <option value="">Select Activity Level</option>

                <option value="Low">Low</option>

                <option value="Moderate">Moderate</option>

                <option value="High">High</option>

            </select>

            <small id="activityError"></small>

        </div>

        <div class="form-group">

            <label>Diet Type</label>

            <select name="diet_type" id="dietType">

                <option value="">Select Diet Type</option>

                <option value="Vegetarian">
                    Vegetarian
                </option>

                <option value="Non-Vegetarian">
                    Non-Vegetarian
                </option>

                <option value="Vegan">
                    Vegan
                </option>

            </select>

            <small id="dietTypeError"></small>

        </div>

        <button type="submit" class="btn">
            Generate Diet Plan
        </button>

    </form>

</section>

<script>

document.getElementById("dietForm").addEventListener("submit", function(e) {

    let valid = true;

    document.querySelectorAll("small").forEach(function(error) {
        error.textContent = "";
    });

    const name =
        document.getElementById("name").value.trim();

    const age =
        Number(document.getElementById("age").value);

    const gender =
        document.getElementById("gender").value;

    const weight =
        Number(document.getElementById("weight").value);

    const height =
        Number(document.getElementById("height").value);

    const goal =
        document.getElementById("goal").value;

    const activity =
        document.getElementById("activity").value;

    const dietType =
        document.getElementById("dietType").value;

    if (!/^[A-Za-z ]{2,60}$/.test(name)) {
        document.getElementById("nameError").textContent =
            "Enter a valid name.";
        valid = false;
    }

    if (age < 13 || age > 80 || !age) {
        document.getElementById("ageError").textContent =
            "Age must be between 13 and 80.";
        valid = false;
    }

    if (!gender) {
        document.getElementById("genderError").textContent =
            "Select your gender.";
        valid = false;
    }

    if (weight < 30 || weight > 300 || !weight) {
        document.getElementById("weightError").textContent =
            "Weight must be between 30 and 300 kg.";
        valid = false;
    }

    if (height < 100 || height > 250 || !height) {
        document.getElementById("heightError").textContent =
            "Height must be between 100 and 250 cm.";
        valid = false;
    }

    if (!goal) {
        document.getElementById("goalError").textContent =
            "Select your fitness goal.";
        valid = false;
    }

    if (!activity) {
        document.getElementById("activityError").textContent =
            "Select your activity level.";
        valid = false;
    }

    if (!dietType) {
        document.getElementById("dietTypeError").textContent =
            "Select your diet type.";
        valid = false;
    }

    if (!valid) {
        e.preventDefault();
    }

});

</script>

</body>
</html>
