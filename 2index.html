<!DOCTYPE html>
<html>
<head>
    <title>Sample HTML with 7 Tags</title>
</head>
<body>

    <h1>Welcome to HTML</h1>          <!-- Heading tag -->
    <p>This is a paragraph.</p>       <!-- Paragraph tag -->
    <a href="https://www.example.com">Visit Example</a> <!-- Link tag -->
    <img src="https://via.placeholder.com/150" alt="Sample Image"> <!-- Image tag -->
    <br>                              <!-- Line break tag -->
    <hr>                              <!-- Horizontal rule tag -->
    <ul>                              <!-- Unordered list tag -->
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

</body>
</html>
